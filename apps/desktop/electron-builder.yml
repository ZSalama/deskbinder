appId: io.github.zacksalama.deskbinder
productName: Deskbinder
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,dev-app-update.yml}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: deskbinder
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  executableName: deskbinder
  maintainer: Zack Salama <zacksalama@gmail.com>
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: zacksalama
  repo: deskbinder
